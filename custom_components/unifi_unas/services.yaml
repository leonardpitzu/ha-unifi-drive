wake_on_lan:
  name: Wake on LAN
  description: Send a Wake-on-LAN magic packet to the configured UniFi Drive device.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional target entry ID. Required when multiple UniFi Drive entries are loaded.
      selector:
        config_entry:
          integration: unifi_unas

reboot:
  name: Restart
  description: Trigger a UniFi OS restart on the configured UniFi Drive device.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional target entry ID. Required when multiple UniFi Drive entries are loaded.
      selector:
        config_entry:
          integration: unifi_unas

shutdown:
  name: Shut down
  description: Trigger a UniFi OS shutdown on the configured UniFi Drive device.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional target entry ID. Required when multiple UniFi Drive entries are loaded.
      selector:
        config_entry:
          integration: unifi_unas

set_fan_mode:
  name: Set fan mode
  description: Set the native UniFi Drive fan mode.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional target entry ID. Required when multiple UniFi Drive entries are loaded.
      selector:
        config_entry:
          integration: unifi_unas
    fan_mode:
      name: Fan mode
      description: Native fan mode option.
      required: true
      selector:
        select:
          options:
            - Quiet
            - Balance
            - Cooling

create_snapshot:
  name: Create snapshot
  description: Create a manual snapshot for a discovered UniFi Drive snapshot target.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional target entry ID. Required when multiple UniFi Drive entries are loaded.
      selector:
        config_entry:
          integration: unifi_unas
    target_key:
      name: Target key
      description: Stable target key from a snapshot entity's attributes, such as shared_shared-1 or mydrive_user-1.
      selector:
        text:
    target_type:
      name: Target type
      description: Optional target type filter.
      selector:
        select:
          options:
            - shared
            - mydrive
    target_id:
      name: Target ID
      description: Optional target ID or user ID.
      selector:
        text:
    target_name:
      name: Target name
      description: Optional target display name.
      selector:
        text:
    description:
      name: Description
      description: Optional snapshot description.
      selector:
        text:
    locked:
      name: Locked
      description: Create the snapshot as locked when supported by UniFi Drive.
      selector:
        boolean:

set_snapshot_limit:
  name: Set snapshot limit
  description: Set the snapshot retention limit for a discovered UniFi Drive snapshot target.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional target entry ID. Required when multiple UniFi Drive entries are loaded.
      selector:
        config_entry:
          integration: unifi_unas
    target_key:
      name: Target key
      description: Stable target key from a snapshot entity's attributes, such as shared_shared-1 or mydrive_user-1.
      selector:
        text:
    target_type:
      name: Target type
      description: Optional target type filter.
      selector:
        select:
          options:
            - shared
            - mydrive
    target_id:
      name: Target ID
      description: Optional target ID or user ID.
      selector:
        text:
    target_name:
      name: Target name
      description: Optional target display name.
      selector:
        text:
    limit:
      name: Limit
      description: Snapshot retention limit.
      required: true
      selector:
        number:
          min: 1
          max: 256
          step: 1
          mode: box

set_snapshot_schedule:
  name: Set snapshot schedule
  description: Set the snapshot schedule for a discovered UniFi Drive snapshot target.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional target entry ID. Required when multiple UniFi Drive entries are loaded.
      selector:
        config_entry:
          integration: unifi_unas
    target_key:
      name: Target key
      description: Stable target key from a snapshot entity's attributes, such as shared_shared-1 or mydrive_user-1.
      selector:
        text:
    target_type:
      name: Target type
      description: Optional target type filter.
      selector:
        select:
          options:
            - shared
            - mydrive
    target_id:
      name: Target ID
      description: Optional target ID or user ID.
      selector:
        text:
    target_name:
      name: Target name
      description: Optional target display name.
      selector:
        text:
    schedule:
      name: Schedule
      description: Snapshot schedule frequency.
      required: true
      selector:
        select:
          options:
            - Never
            - Daily
            - Weekly
            - Monthly
    schedule_time:
      name: Schedule time
      description: Optional schedule time in HH:MM.
      selector:
        time:
    weekday:
      name: Weekday
      description: Optional weekday for weekly schedules.
      selector:
        select:
          options:
            - Sunday
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
    monthday:
      name: Month day
      description: Optional day from 1 to 31 for monthly schedules.
      selector:
        number:
          min: 1
          max: 31
          step: 1
          mode: box
