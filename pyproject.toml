[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports)
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear (common bug patterns)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long - handled by line-length, not worth churn
]

[tool.ruff.lint.per-file-ignores]
# Platform imports happen after Home Assistant setup imports so HA does not
# first import platform modules while setting up the config entry.
"custom_components/unifi_unas/__init__.py" = ["E402", "F401"]

# These imports prime modules patched by pytest-homeassistant-custom-component.
"tests/conftest.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
pretty = true
files = ["custom_components/unifi_unas"]

[tool.coverage.run]
source = ["custom_components/unifi_unas"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
